<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>深维之家 · 客服咨询 — 界面设计稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --teal-400:#2DD4C8;
  --teal-500:#14B8A6;
  --teal-600:#0D9488;
  --deep-700:#0B6477;
  --deep-800:#084A5C;
  --cyan-glow:#5EEAD4;
  --ink:#17323F;
  --ink-soft:#5B7280;
  --bg:#F4F9F9;
  --card:#FFFFFF;
  --bubble-bot:#FFFFFF;
  --bubble-user:linear-gradient(135deg,#14B8A6,#0EA5E9);
  --shadow-soft:0 8px 24px rgba(11,100,119,.10);
  --shadow-lift:0 16px 40px rgba(11,100,119,.16);
  --radius-lg:22px;
  --radius-md:16px;
  --font-latin:'Nunito','PingFang SC','HarmonyOS Sans SC','MiSans',sans-serif;
  --font-cn:'PingFang SC','HarmonyOS Sans SC','MiSans','Nunito',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font-cn);
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(20,184,166,.14), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(14,165,233,.12), transparent 60%),
    #E9F2F3;
  display:flex;align-items:center;justify-content:center;min-height:100vh;
}

/* ============ 手机框（桌面预览用） ============ */
.phone{
  width:390px;height:812px;background:var(--bg);border-radius:44px;
  box-shadow:0 0 0 10px #0E1E26,0 0 0 12px #2A3F4A,0 40px 80px rgba(8,74,92,.35);
  overflow:hidden;position:relative;display:flex;flex-direction:column;
}
@media (max-width:430px){
  .phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}
}
.stage-note{
  position:fixed;left:28px;top:26px;color:#33566B;user-select:none;
}
.stage-note b{font-family:var(--font-latin);font-size:15px;letter-spacing:.06em;display:block;color:#0B6477}
.stage-note span{font-size:12px;opacity:.75}
@media (max-width:900px){.stage-note{display:none}}

/* ============ 状态栏 & 导航 ============ */
.statusbar{
  height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-family:var(--font-latin);font-weight:800;font-size:14px;color:var(--ink);
  background:linear-gradient(180deg,#DFF5F2 0%,rgba(223,245,242,0) 100%);position:relative;z-index:5;
}
.statusbar .icons{display:flex;gap:5px;align-items:center}
.navbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px 12px;position:relative;z-index:5;
}
.navbar .title{font-weight:700;font-size:17px;color:var(--ink);letter-spacing:.02em}
.nav-btn{
  width:34px;height:34px;border-radius:12px;border:none;background:rgba(255,255,255,.75);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 2px 8px rgba(11,100,119,.08);color:var(--deep-700);backdrop-filter:blur(6px);
}
.nav-btn:active{transform:scale(.92)}

/* ============ 聊天滚动区 ============ */
.chat-scroll{
  flex:1;overflow-y:auto;padding:0 16px 12px;position:relative;
  background:
    linear-gradient(180deg,#CDEFEA 0%,#E7F6F4 240px,rgba(231,246,244,0) 420px);
  scrollbar-width:none;
}
.chat-scroll::-webkit-scrollbar{display:none}
.pull-hint{
  display:flex;align-items:center;gap:12px;margin:6px 0 14px;color:#9AB5BE;
  font-size:12px;letter-spacing:.08em;
}
.pull-hint::before,.pull-hint::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#CBDEE2,transparent)}

/* ============ Hero 欢迎区 ============ */
.hero{
  position:relative;border-radius:var(--radius-lg);padding:26px 22px 30px;
  background:
    radial-gradient(340px 200px at 88% -20%, rgba(94,234,212,.55), transparent 60%),
    radial-gradient(300px 220px at -10% 120%, rgba(14,165,233,.35), transparent 55%),
    linear-gradient(150deg,#0E7D8F 0%,#12A5A5 55%,#2CC7B4 100%);
  color:#fff;overflow:hidden;margin-bottom:16px;
  box-shadow:var(--shadow-lift);
  animation:heroIn .7s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes heroIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.hero .waves{position:absolute;left:0;right:0;bottom:-2px;pointer-events:none}
.hero .spark{position:absolute;border-radius:50%;background:rgba(255,255,255,.7);animation:twinkle 2.6s ease-in-out infinite}
.hero .spark:nth-child(1){width:5px;height:5px;top:20px;left:32%}
.hero .spark:nth-child(2){width:3px;height:3px;top:52px;left:8%;animation-delay:.9s}
.hero .spark:nth-child(3){width:4px;height:4px;top:14px;right:38%;animation-delay:1.6s}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.15)}}
.hero-hello{
  font-family:var(--font-latin);font-weight:900;font-size:38px;line-height:1.05;
  background:linear-gradient(100deg,#B9F7EE 10%,#7DE9FF 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:heroIn .6s .1s cubic-bezier(.2,.9,.3,1.2) both;
}
.hero-sub{margin-top:8px;font-size:15px;font-weight:600;color:#E8FBF8;animation:heroIn .6s .2s cubic-bezier(.2,.9,.3,1.2) both}
.hero-sub em{font-style:normal;color:#FFE5A3;border-bottom:2px solid rgba(255,229,163,.6);padding-bottom:1px}
.mascot{
  position:absolute;right:6px;bottom:-8px;width:132px;height:150px;
  filter:drop-shadow(0 12px 18px rgba(8,74,92,.35));
  animation:floaty 3.6s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
.mascot .arm{transform-origin:78% 18%;animation:wave 2.2s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0deg)}70%{transform:rotate(-24deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-18deg)}}

/* ============ 推荐问题卡片 ============ */
.suggest{
  background:var(--card);border-radius:var(--radius-lg);padding:18px 18px 8px;
  box-shadow:var(--shadow-soft);margin-bottom:18px;
  animation:heroIn .6s .3s cubic-bezier(.2,.9,.3,1.2) both;
}
.suggest h4{font-size:13px;color:var(--ink-soft);font-weight:600;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.suggest h4 .dot{width:6px;height:6px;border-radius:50%;background:var(--teal-500);box-shadow:0 0 0 3px rgba(20,184,166,.18)}
.suggest-item{
  display:flex;align-items:center;gap:10px;padding:13px 4px;cursor:pointer;
  border-bottom:1px solid #EFF4F5;font-size:15px;color:var(--ink);font-weight:500;
  transition:background .15s;border-radius:10px;
}
.suggest-item:last-child{border-bottom:none}
.suggest-item:hover{background:#F2FBFA}
.suggest-item:active{background:#E4F6F3}
.suggest-item .sparkle{color:var(--teal-500);flex-shrink:0}
.suggest-item .chev{margin-left:auto;color:#C3D4D9;flex-shrink:0;transition:transform .2s}
.suggest-item:hover .chev{transform:translateX(3px);color:var(--teal-500)}

/* ============ 消息气泡 ============ */
.msg{display:flex;gap:10px;margin:14px 0;animation:msgIn .45s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(140deg,#E9FDFA,#C9F3EC);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(11,100,119,.15);overflow:hidden;
}
.avatar svg{width:30px;height:30px}
.bubble{
  max-width:72%;padding:12px 15px;border-radius:18px;font-size:15px;line-height:1.65;
  color:var(--ink);background:var(--bubble-bot);box-shadow:var(--shadow-soft);
  border-top-left-radius:6px;word-break:break-word;
}
.msg.user .bubble{
  background:var(--bubble-user);color:#fff;border-top-left-radius:18px;border-top-right-radius:6px;
  box-shadow:0 8px 20px rgba(14,165,233,.35);
}
.bubble img.pic{max-width:100%;border-radius:12px;display:block;margin-top:2px}
.time-stamp{text-align:center;font-size:11px;color:#9AB5BE;margin:18px 0 6px;letter-spacing:.05em}
.sys-tip{
  text-align:center;margin:14px auto;max-width:80%;
  font-size:12.5px;color:var(--deep-700);background:rgba(20,184,166,.10);
  border:1px dashed rgba(20,184,166,.4);padding:9px 14px;border-radius:14px;
  animation:msgIn .4s both;
}
.typing .dot{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:#8FCFD6;animation:blink 1.2s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

/* ============ 快捷操作条 ============ */
.quickbar{
  display:flex;gap:10px;padding:10px 16px 4px;background:transparent;
}
.chip{
  display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;
  background:#fff;border:1.5px solid #D8EBEA;color:var(--deep-700);
  font-size:13.5px;font-weight:600;cursor:pointer;transition:all .2s;
  box-shadow:0 3px 10px rgba(11,100,119,.06);
}
.chip:hover{border-color:var(--teal-500);color:var(--teal-600)}
.chip:active{transform:scale(.95)}

/* ============ 输入区 ============ */
.inputzone{background:linear-gradient(180deg,rgba(244,249,249,0),var(--bg) 30%)}
.inputbar{
  display:flex;align-items:center;gap:10px;margin:8px 14px 10px;
  background:#fff;border-radius:999px;padding:7px 8px 7px 6px;
  box-shadow:0 6px 22px rgba(11,100,119,.12);border:1.5px solid #E2EFEE;
}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:none;background:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:#7FA3AD;transition:all .2s;flex-shrink:0;
}
.icon-btn:hover{background:#EFF8F7;color:var(--teal-600)}
.icon-btn:active{transform:scale(.88)}
.icon-btn.active{background:rgba(20,184,166,.14);color:var(--teal-600)}
.inputbar input{
  flex:1;border:none;outline:none;font-size:15px;font-family:var(--font-cn);
  color:var(--ink);background:transparent;min-width:0;
}
.inputbar input::placeholder{color:#AEC6CD}
.send-btn{
  width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
  background:linear-gradient(135deg,var(--teal-500),#0EA5E9);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(20,184,166,.4);transition:all .2s;
}
.send-btn:disabled{opacity:.35;box-shadow:none;cursor:default}
.send-btn:not(:disabled):active{transform:scale(.9)}
.send-btn:not(:disabled):hover{box-shadow:0 6px 18px rgba(20,184,166,.55)}

/* ============ 底部扩展面板 ============ */
.panel{
  max-height:0;overflow:hidden;transition:max-height .32s cubic-bezier(.4,0,.2,1);
  background:#fff;
}
.panel.open{max-height:300px;box-shadow:0 -8px 30px rgba(11,100,119,.10)}
.panel-inner{padding:18px 22px 8px}
.panel-label{font-size:12px;color:#9AB5BE;margin-bottom:12px;letter-spacing:.05em}
.panel-grid{display:flex;gap:18px;padding-bottom:14px}
.panel-item{
  display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;
  transition:transform .15s;
}
.panel-item:active{transform:scale(.92)}
.panel-item .tile{
  width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#E6FAF7,#D2F2FC);color:var(--teal-600);
  box-shadow:inset 0 0 0 1.5px rgba(20,184,166,.18);
}
.panel-item span{font-size:12px;color:var(--ink-soft)}
.emoji-grid{
  display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:14px 18px 18px;
  max-height:220px;overflow-y:auto;
}
.emoji-grid button{
  font-size:24px;background:none;border:none;border-radius:10px;cursor:pointer;
  padding:5px 0;transition:transform .12s,background .12s;
}
.emoji-grid button:hover{background:#EFF8F7}
.emoji-grid button:active{transform:scale(1.25)}
.home-indicator{height:22px;display:flex;align-items:center;justify-content:center}
.home-indicator::after{content:'';width:130px;height:5px;border-radius:3px;background:#C9DADD}
</style>
</head>
<body>

<div class="stage-note">
  <b>深维之家 · 客服咨询小程序</b>
  <span>界面设计稿 v0.1 — 可交互原型：点推荐问题 / 发表情 / 发图片 / 转人工</span>
</div>

<div class="phone">
  <!-- 状态栏 -->
  <div class="statusbar">
    <span>11:24</span>
    <div class="icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 9.5a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8zM8 5.8c-1.6 0-3 .6-4.1 1.7l1.4 1.4A3.9 3.9 0 018 7.8c1 0 2 .4 2.7 1.1l1.4-1.4A5.8 5.8 0 008 5.8zM8 2C5.5 2 3.2 3 .5 5.1L1.9 6.5A8.3 8.3 0 018 4c2.4 0 4.5.9 6.1 2.5l1.4-1.4C13 3 10.5 2 8 2z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4c1-.2 1.6-1 1.6-2S24 4.2 23 4z" fill="currentColor" opacity=".4"/></svg>
    </div>
  </div>

  <!-- 导航 -->
  <div class="navbar">
    <button class="nav-btn" title="返回"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="title">深维之家</span>
    <button class="nav-btn" title="更多"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </div>

  <!-- 聊天区 -->
  <div class="chat-scroll" id="chatScroll">
    <div class="pull-hint">下拉查看历史对话</div>

    <!-- Hero 欢迎区 -->
    <div class="hero">
      <span class="spark"></span><span class="spark"></span><span class="spark"></span>
      <div class="hero-hello">Hello :)</div>
      <div class="hero-sub">我是<em>深维之家</em>咨询小助手</div>
      <svg class="mascot" viewBox="0 0 132 150">
        <!-- 挥手 -->
        <g class="arm">
          <path d="M104 38 Q118 22 126 30" stroke="#fff" stroke-width="9" stroke-linecap="round" fill="none"/>
          <circle cx="127" cy="28" r="8" fill="#fff"/>
        </g>
        <!-- 天线 -->
        <line x1="66" y1="16" x2="66" y2="28" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="66" cy="12" r="5" fill="#FFE5A3"/>
        <!-- 头 -->
        <rect x="30" y="26" width="72" height="58" rx="24" fill="#fff"/>
        <!-- 面罩 -->
        <rect x="40" y="40" width="52" height="30" rx="14" fill="#0B6477"/>
        <circle cx="56" cy="55" r="5" fill="#5EEAD4"/>
        <circle cx="76" cy="55" r="5" fill="#5EEAD4"/>
        <path d="M58 63 q8 5 16 0" stroke="#5EEAD4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- 身体 -->
        <rect x="42" y="88" width="48" height="38" rx="16" fill="#fff"/>
        <rect x="52" y="98" width="28" height="18" rx="6" fill="#D9F6F1"/>
        <path d="M56 107 l5 4 9-8" stroke="#14B8A6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- 书 -->
        <rect x="88" y="100" width="24" height="18" rx="3" fill="#2CC7B4" transform="rotate(8 100 109)"/>
        <line x1="100" y1="103" x2="100" y2="117" stroke="#fff" stroke-width="2" transform="rotate(8 100 109)"/>
      </svg>
      <svg class="waves" viewBox="0 0 390 60" preserveAspectRatio="none">
        <path d="M0 34 Q60 12 130 30 T260 28 T390 24 V60 H0 Z" fill="rgba(255,255,255,.16)"/>
        <path d="M0 44 Q80 26 170 40 T390 38 V60 H0 Z" fill="rgba(244,249,249,.35)"/>
        <path d="M0 52 Q90 40 200 50 T390 48 V60 H0 Z" fill="#F4F9F9"/>
      </svg>
    </div>

    <!-- 推荐问题 -->
    <div class="suggest">
      <h4><span class="dot"></span>你可以这样问我</h4>
      <div class="suggest-item" onclick="sendText(this.dataset.q, true)" data-q="会员积分充错账户了怎么办？">
        <svg class="sparkle" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.1 6.2L20 10l-5.9 1.8L12 18l-2.1-6.2L4 10l5.9-1.8L12 2zm7 12l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3z"/></svg>
        会员积分充错账户了怎么办？
        <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="suggest-item" onclick="sendText(this.dataset.q, true)" data-q="怎么创建家庭组？">
        <svg class="sparkle" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.1 6.2L20 10l-5.9 1.8L12 18l-2.1-6.2L4 10l5.9-1.8L12 2zm7 12l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3z"/></svg>
        怎么创建家庭组？
        <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="suggest-item" onclick="sendText(this.dataset.q, true)" data-q="积分兑换的优惠券在哪里查看？">
        <svg class="sparkle" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.1 6.2L20 10l-5.9 1.8L12 18l-2.1-6.2L4 10l5.9-1.8L12 2zm7 12l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3z"/></svg>
        积分兑换的优惠券在哪里查看？
        <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>

    <!-- 消息流 -->
    <div id="messages">
      <div class="msg">
        <div class="avatar" id="botAvatar"></div>
        <div class="bubble">您好！我是深维之家咨询小助手，很高兴为您服务！请问有什么可以帮到您的呢？</div>
      </div>
    </div>
  </div>

  <!-- 快捷操作条：仅转人工 -->
  <div class="quickbar">
    <button class="chip" onclick="transferHuman()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0118 0v5a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3M3 12v5a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3"/></svg>
      转人工
    </button>
  </div>

  <!-- 输入区 -->
  <div class="inputzone">
    <div class="inputbar">
      <button class="icon-btn" onclick="togglePanel('panelImage',this)" title="添加图片">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      </button>
      <input id="input" placeholder="有什么不懂的可以问我" oninput="onInput()" onkeydown="if(event.key==='Enter')sendInput()">
      <button class="icon-btn" id="emojiBtn" onclick="togglePanel('panelEmoji',this)" title="表情">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.2 1.8 3.5 1.8 3.5-1.8 3.5-1.8"/><circle cx="9" cy="9.5" r=".8" fill="currentColor"/><circle cx="15" cy="9.5" r=".8" fill="currentColor"/></svg>
      </button>
      <button class="send-btn" id="sendBtn" onclick="sendInput()" disabled>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.5-7.5c.8-.4.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.3-1.3 1L3.3 11c0 .3.3.5.5.5l9.2.5-9.2.5c-.3 0-.5.2-.5.5l-1.2 6.4c-.1.7.6 1.3 1.3 1z"/></svg>
      </button>
    </div>

    <!-- 图片面板（仅图片入口） -->
    <div class="panel" id="panelImage">
      <div class="panel-inner">
        <div class="panel-label">发送图片</div>
        <div class="panel-grid">
          <div class="panel-item" onclick="sendPic()">
            <div class="tile"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-4.5-4.5L7 20"/></svg></div>
            <span>图片</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 表情面板 -->
    <div class="panel" id="panelEmoji">
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>

<script>
/* ---------- 机器人头像复用 ---------- */
const AVATAR_SVG = `<svg viewBox="0 0 132 150">
  <line x1="66" y1="16" x2="66" y2="28" stroke="#14B8A6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="66" cy="12" r="6" fill="#FFE5A3"/>
  <rect x="30" y="26" width="72" height="58" rx="24" fill="#fff" stroke="#D5EEEA" stroke-width="2"/>
  <rect x="40" y="40" width="52" height="30" rx="14" fill="#0B6477"/>
  <circle cx="56" cy="55" r="5" fill="#5EEAD4"/><circle cx="76" cy="55" r="5" fill="#5EEAD4"/>
  <path d="M58 63 q8 5 16 0" stroke="#5EEAD4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="42" y="88" width="48" height="38" rx="16" fill="#fff" stroke="#D5EEEA" stroke-width="2"/>
</svg>`;
document.getElementById('botAvatar').innerHTML = AVATAR_SVG;

/* ---------- 演示用回复 ---------- */
const CANNED = {
  '会员积分充错账户了怎么办？': '别着急～请您提供充错账户的手机号和充值订单号，小助手会为您登记积分调账申请，1 个工作日内处理完成，积分会原路退回您的账户 📮',
  '怎么创建家庭组？': '创建家庭组很简单：打开「我的」→「家庭管理」→「创建家庭组」，然后把邀请码分享给家人，家人加入后即可共享权益 👨‍👩‍👧',
  '积分兑换的优惠券在哪里查看？': '兑换成功后，优惠券会自动放入「我的」→「卡券包」里，下单结算时可直接勾选使用哦 🎫'
};
const FALLBACK = [
  '收到～您的问题小助手已经记录啦，正在为您查询相关信息，请稍候 🔍',
  '好的，关于这个问题，您可以补充一些细节（比如订单号或发生时间），小助手帮您更精准地解答 ✍️'
];

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
let msgSeq = 0;

function scrollBottom(){ requestAnimationFrame(()=>{ const s=document.getElementById('chatScroll'); s.scrollTo({top:s.scrollHeight,behavior:'smooth'}); }); }

function addUserMsg(html){
  const d=document.createElement('div'); d.className='msg user';
  d.innerHTML=`<div class="bubble">${html}</div>`;
  messagesEl.appendChild(d); scrollBottom();
}
function addBotTyping(){
  const d=document.createElement('div'); d.className='msg'; d.id='typing_'+(++msgSeq);
  d.innerHTML=`<div class="avatar">${AVATAR_SVG}</div><div class="bubble typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  messagesEl.appendChild(d); scrollBottom(); return d.id;
}
function resolveTyping(id, text){
  const el=document.getElementById(id);
  if(!el) return;
  el.querySelector('.bubble').classList.remove('typing');
  el.querySelector('.bubble').textContent=text; scrollBottom();
}
function botReply(q){
  const tid=addBotTyping();
  const answer = CANNED[q] || FALLBACK[Math.floor(Math.random()*FALLBACK.length)];
  const delay = 900 + answer.length*12;
  setTimeout(()=>resolveTyping(tid, answer), Math.min(delay, 2400));
}

function sendText(text, fromSuggest){
  if(!text.trim()) return;
  if(fromSuggest) collapsePanels();
  addUserMsg(escapeHtml(text.trim()));
  inputEl.value=''; onInput();
  botReply(text.trim());
}
function sendInput(){ sendText(inputEl.value, false); }
function onInput(){ sendBtn.disabled = !inputEl.value.trim(); }
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- 图片（演示：内嵌占位图） ---------- */
function sendPic(){
  collapsePanels();
  const d=document.createElement('div'); d.className='msg user';
  d.innerHTML=`<div class="bubble"><span style="font-size:13px;opacity:.85">🖼️ 图片消息</span><img class="pic" alt="用户发送的图片" src="data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='280' height='180'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2314B8A6'/><stop offset='1' stop-color='%230EA5E9'/></linearGradient></defs><rect width='280' height='180' rx='12' fill='url(%23g)'/><circle cx='90' cy='62' r='20' fill='rgba(255,255,255,.65)'/><path d='M0 150 L90 90 L150 135 L200 100 L280 160 V180 H0 Z' fill='rgba(255,255,255,.4)'/></svg>`)}"></div>`;
  messagesEl.appendChild(d); scrollBottom();
  const tid=addBotTyping();
  setTimeout(()=>resolveTyping(tid,'图片已收到啦～目前小助手还在学习看图，您可以先用文字描述一下图片里的问题，我来帮您处理 📝'), 1300);
}

/* ---------- 转人工 ---------- */
function transferHuman(){
  collapsePanels();
  const tip=document.createElement('div'); tip.className='sys-tip';
  tip.textContent='已为您转接人工客服，请稍候…当前排队 1 人';
  messagesEl.appendChild(tip); scrollBottom();
}

/* ---------- 面板开合 ---------- */
const panels=['panelEmoji','panelImage'];
function togglePanel(id, btn){
  const target=document.getElementById(id);
  const isOpen=target.classList.contains('open');
  collapsePanels();
  if(!isOpen){ target.classList.add('open'); btn.classList.add('active'); }
}
function collapsePanels(){
  panels.forEach(p=>document.getElementById(p).classList.remove('open'));
  document.querySelectorAll('.icon-btn.active').forEach(b=>b.classList.remove('active'));
}

/* ---------- 表情盘 ---------- */
const EMOJIS=['😀','😁','🤣','😊','😍','🤔','😅','😭','😤','😱','🥳','😴','🤝','👍','👏','🙏','💪','🔥','✨','💝','🎉','🌹','☕','🎁','📞','💬','📮','⚠️','✅','❌','⭐','🌙'];
const grid=document.getElementById('emojiGrid');
EMOJIS.forEach(e=>{
  const b=document.createElement('button'); b.textContent=e;
  b.onclick=()=>{ inputEl.value+=e; onInput(); };
  grid.appendChild(b);
});
</script>
</body>
</html>
